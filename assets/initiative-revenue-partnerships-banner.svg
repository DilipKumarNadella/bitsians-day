<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520" role="img" aria-labelledby="title desc">
  <title id="title">Drive Revenue and Partnerships for BITSAA</title>
  <desc id="desc">Initiative banner with a bold red gradient background and headline text.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4a000a"/>
      <stop offset="55%" stop-color="#9a0018"/>
      <stop offset="100%" stop-color="#2a0a0f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.15" r="0.65">
      <stop offset="0%" stop-color="#ffcc7a" stop-opacity="0.44"/>
      <stop offset="100%" stop-color="#ffcc7a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f4d28a" stop-opacity="0"/>
      <stop offset="50%" stop-color="#f4d28a" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#f4d28a" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="520" fill="url(#bg)"/>
  <rect width="1600" height="520" fill="url(#glow)"/>

  <g opacity="0.16" fill="none" stroke="#ffdca2" stroke-width="2">
    <path d="M0 420 C300 350, 620 440, 980 360 C1220 305, 1420 365, 1600 340"/>
    <path d="M0 454 C340 390, 700 470, 1040 410 C1270 365, 1460 418, 1600 400"/>
    <path d="M0 384 C310 325, 660 390, 980 330 C1260 280, 1430 330, 1600 316"/>
  </g>

  <g transform="translate(120,120)">
    <text x="0" y="0" fill="#f6dca0" font-family="'Playfair Display', Georgia, serif" font-size="42" font-weight="700" letter-spacing="2">
      INITIATIVE
    </text>
    <rect x="0" y="30" width="980" height="3" fill="url(#line)"/>

    <text x="0" y="145" fill="#ffffff" font-family="'Playfair Display', Georgia, serif" font-size="70" font-weight="700">
      Drive Revenue and
    </text>
    <text x="0" y="230" fill="#ffffff" font-family="'Playfair Display', Georgia, serif" font-size="70" font-weight="700">
      Partnerships for BITSAA
    </text>

    <text x="0" y="300" fill="#f5dca4" font-family="'DM Sans', Arial, sans-serif" font-size="29" font-weight="500" letter-spacing="1.2">
      Strengthening partner collaborations and long-term community impact.
    </text>
  </g>
</svg>

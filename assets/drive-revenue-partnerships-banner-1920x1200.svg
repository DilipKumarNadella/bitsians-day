<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1200" viewBox="0 0 1920 1200" role="img" aria-labelledby="title desc">
  <title id="title">Drive Revenue and Partnerships for BITSAA</title>
  <desc id="desc">Initiative banner in 16:10 ratio for BITSAA.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#380007"/>
      <stop offset="52%" stop-color="#a5041d"/>
      <stop offset="100%" stop-color="#23070c"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.86" cy="0.1" r="0.8">
      <stop offset="0%" stop-color="#ffd47f" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ffd47f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f5cf85" stop-opacity="0"/>
      <stop offset="50%" stop-color="#f5cf85" stop-opacity="1"/>
      <stop offset="100%" stop-color="#f5cf85" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1920" height="1200" fill="url(#bg)"/>
  <rect width="1920" height="1200" fill="url(#sun)"/>

  <g opacity="0.17" fill="none" stroke="#ffdca4" stroke-width="3">
    <path d="M0 910 C360 840, 760 960, 1160 860 C1440 790, 1680 860, 1920 820"/>
    <path d="M0 980 C420 900, 860 1020, 1270 930 C1540 870, 1730 940, 1920 910"/>
    <path d="M0 845 C380 770, 780 865, 1160 790 C1460 730, 1700 785, 1920 760"/>
  </g>

  <g transform="translate(150,250)">
    <text x="0" y="0" fill="#f6d79b" font-family="'Playfair Display', Georgia, serif" font-size="58" font-weight="700" letter-spacing="4">
      BITSAA INITIATIVE
    </text>
    <rect x="0" y="42" width="1180" height="4" fill="url(#gold)"/>

    <text x="0" y="240" fill="#ffffff" font-family="'Playfair Display', Georgia, serif" font-size="130" font-weight="700">
      Drive Revenue and
    </text>
    <text x="0" y="390" fill="#ffffff" font-family="'Playfair Display', Georgia, serif" font-size="130" font-weight="700">
      Partnerships for BITSAA
    </text>

    <text x="0" y="500" fill="#f6d79b" font-family="'DM Sans', Arial, sans-serif" font-size="46" font-weight="500" letter-spacing="1.1">
      Building strategic collaborations to power alumni impact and long-term growth.
    </text>
  </g>
</svg>
